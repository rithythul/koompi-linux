# Gate 0 target two. Deliberately dissimilar to the other target in
# architecture and, from M2, in userland shape.
name = "aarch64-headless"
triple = "aarch64-koompi-linux-gnu"
arch = "aarch64"
kernel_arch = "arm64"
# DESIGN.md C4: config/kernel/ fragments, merged in this order
kernel_config = ["core", "hardening", "virt", "aarch64-headless"]
contents = ["boot-services", "linux"]

# DESIGN.md C5: hardening is policy, and policy that names an architecture
# lives here. Exported for every target recipe; a recipe strips what it
# cannot take. -O2 is here because an exported CFLAGS silences autoconf's
# default of -O2 -g, and glibc refuses to build unoptimised.
cflags = ["-O2", "-D_FORTIFY_SOURCE=3", "-fstack-clash-protection", "-mbranch-protection=standard"]
ldflags = ["-Wl,-z,relro,-z,now"]
# DESIGN.md C6: nothing in this target may be setuid or setgid
setuid = []

[boot]
machine = "virt"
cpu = "cortex-a57"
console = "ttyAMA0"
