# Gate 0 target two. Deliberately dissimilar to the other target in
# architecture and, from M2, in userland shape.
name = "aarch64-headless"
triple = "aarch64-koompi-linux-gnu"
arch = "aarch64"
kernel_arch = "arm64"
kernel_config = "config/kernel/aarch64-headless.config"
contents = ["boot-services", "linux"]

[boot]
machine = "virt"
cpu = "cortex-a57"
console = "ttyAMA0"
