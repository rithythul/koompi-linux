# The real cross compiler: C and C++, shared libraries, threads, against our
# own glibc. Everything after this is built by this.
name = "gcc"
version = "15.3.0"
kind = "host-tool"

[source]
url = "https://ftp.gnu.org/gnu/gcc/gcc-15.3.0/gcc-15.3.0.tar.xz"
sha256 = "fa59c1beef8995f27c4d71c1df227587189315d3e6faff1bb4306e61b0c530eb"
license = "GPL-3.0-or-later WITH GCC-exception-3.1"

[build]
system = "configure"
configure = [
  "--prefix=$OUT",
  "--target=$TRIPLE",
  "--with-sysroot=$SYSROOT",
  # gcc's driver looks for an unprefixed `as` and `ld`, and the seed has both
  # on PATH. Where the seed's architecture matches the target that silently
  # works and the seed's binutils quietly assembles everything; where it does
  # not, it fails with `as: unrecognized option`. These two bake an absolute
  # path into the driver, which is the only thing that survives installation.
  # (--with-build-time-tools does not: it only affects gcc's own build.)
  "--with-as=$KB_BINUTILS/bin/$TRIPLE-as",
  "--with-ld=$KB_BINUTILS/bin/$TRIPLE-ld",
  "--enable-languages=c,c++",
  "--enable-shared",
  "--enable-threads=posix",
  "--enable-__cxa_atexit",
  "--enable-default-pie",
  "--enable-default-ssp",
  "--with-system-zlib",
  "--disable-multilib",
  "--disable-nls",
  "--disable-bootstrap",
]

# gcc is a host tool, but libgcc_s and libstdc++ are target code that ships
# in every image (via gcc-libs), so they take the target's flags and the
# build-path map the same way every target build does.
[build.env]
CFLAGS_FOR_TARGET = "$TARGET_CFLAGS"
CXXFLAGS_FOR_TARGET = "$TARGET_CFLAGS"
LDFLAGS_FOR_TARGET = "$TARGET_LDFLAGS"

[deps]
build = ["binutils", "gcc-bootstrap", "linux-headers", "glibc"]
