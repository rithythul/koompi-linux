name = "binutils"
version = "2.47"
kind = "host-tool"

[source]
url = "https://ftp.gnu.org/gnu/binutils/binutils-2.47.tar.xz"
sha256 = "154ab23b60070e8f27013c22977f1129425d67d1e8acd6e13010e617811e4cff"

[build]
system = "configure"
configure = [
  "--prefix=$OUT",
  "--target=$TRIPLE",
  "--with-sysroot=$SYSROOT",
  "--disable-nls",
  "--disable-werror",
  "--disable-multilib",
  "--enable-deterministic-archives",
]
