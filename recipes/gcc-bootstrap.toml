# A C compiler good enough to build glibc, and nothing more. It is built
# without a libc, which is why it can exist before one does.
#
# spec.md decision 6 calls for a seed that gets discarded. This is the hinge:
# below it the seed container's compiler is doing the work, above it ours is.
name = "gcc-bootstrap"
version = "15.3.0"
kind = "host-tool"

[source]
url = "https://ftp.gnu.org/gnu/gcc/gcc-15.3.0/gcc-15.3.0.tar.xz"
sha256 = "fa59c1beef8995f27c4d71c1df227587189315d3e6faff1bb4306e61b0c530eb"
license = "GPL-3.0-or-later WITH GCC-exception-3.1"

[build]
system = "configure"
configure = [
  "--prefix=$OUT",
  "--target=$TRIPLE",
  "--with-sysroot=$SYSROOT",
  # gcc's driver looks for an unprefixed `as` and `ld`, and the seed has both
  # on PATH. Where the seed's architecture matches the target that silently
  # works and the seed's binutils quietly assembles everything; where it does
  # not, it fails with `as: unrecognized option`. These two bake an absolute
  # path into the driver, which is the only thing that survives installation.
  # (--with-build-time-tools does not: it only affects gcc's own build.)
  "--with-as=$KB_BINUTILS/bin/$TRIPLE-as",
  "--with-ld=$KB_BINUTILS/bin/$TRIPLE-ld",
  "--with-glibc-version=2.44",
  "--with-newlib",
  "--without-headers",
  "--enable-languages=c",
  "--enable-default-pie",
  "--enable-default-ssp",
  "--disable-nls",
  "--disable-shared",
  "--disable-multilib",
  "--disable-threads",
  "--disable-libatomic",
  "--disable-libgomp",
  "--disable-libquadmath",
  "--disable-libssp",
  "--disable-libvtv",
  "--disable-libstdcxx",
]

[deps]
build = ["binutils"]
