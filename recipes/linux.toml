# The kernel. `defconfig` plus the target's fragment: the defaults are
# upstream's problem, and what we decided is one readable file per target.
name = "linux"
version = "6.18.49"
kind = "target"

[source]
url = "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.18.49.tar.xz"
sha256 = "ae826f33111fea6f1d279dde7299d7463c8dfd204aeb75a8fb5432bc60a28191"

[build]
system = "shell"
script = """
cd "$SRC"
kmake() { make ARCH="$KARCH" CROSS_COMPILE="$TRIPLE-" "$@"; }

kmake defconfig
scripts/kconfig/merge_config.sh -m .config "$KERNEL_CONFIG"
kmake olddefconfig

# every fragment line has to survive olddefconfig, or the image is not the
# one the target asked for
while read -r line; do
    case "$line" in ''|'#'*) continue ;; esac
    grep -qx "$line" .config || { echo "kernel config lost: $line"; exit 1; }
done < "$KERNEL_CONFIG"

kmake -j"$JOBS" all

install -Dm644 "$(kmake -s image_name)" "$OUT/boot/vmlinuz"
install -Dm644 .config "$OUT/boot/config"
install -Dm644 System.map "$OUT/boot/System.map"
kmake INSTALL_MOD_PATH="$OUT/usr" INSTALL_MOD_STRIP=1 modules_install
"""

[deps]
build = ["binutils", "gcc"]
runtime = []
